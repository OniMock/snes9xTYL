name: Build snes9xTYL PSP

on:
  push:
    branches: [ mecm, main, master ]
  pull_request:
    branches: [ mecm, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
    
    strategy:
      matrix:
        variant: [me, cm]
        include:
          - variant: me
            make_target: mehomeadhoc
            artifact_name: snes9xTYLme_mod
          - variant: cm
            make_target: cm
            artifact_name: snes9xTYLcm_mod
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apk add --no-cache build-base zlib-dev

      - name: Build ${{ matrix.artifact_name }}
        run: |
          export PSPSDK=$(psp-config --pspsdk-path)
          export PSPDEV=$(psp-config --pspdev-path)
          export PATH=$PATH:$PSPDEV/bin
          make clean || true
          make ${{ matrix.make_target }} 2>&1 | tail -50

      - name: Verify build output
        run: |
          echo "=== Build artifacts ==="
          find . -name "EBOOT.PBP" -o -name "*.elf" -o -name "*.prx" | head -20
          ls -la EBOOT.PBP 2>/dev/null || ls -la snes9xTYL/EBOOT.PBP 2>/dev/null || echo "EBOOT.PBP not found at expected paths"

      - name: Prepare artifact
        run: |
          mkdir -p artifact/${{ matrix.artifact_name }}
          # Try multiple possible output locations
          cp EBOOT.PBP artifact/${{ matrix.artifact_name }}/ 2>/dev/null || \
          cp snes9xTYL/EBOOT.PBP artifact/${{ matrix.artifact_name }}/ 2>/dev/null || \
          echo "Warning: EBOOT.PBP not found"
          # Copy data files for the release
          if [ -d data ]; then
            cp -r data artifact/${{ matrix.artifact_name }}/
          fi
          # Add readme
          echo "snes9xTYL-mecm ${{ matrix.variant }} build" > artifact/${{ matrix.artifact_name }}/BUILD_INFO.txt
          echo "Built: $(date -u)" >> artifact/${{ matrix.artifact_name }}/BUILD_INFO.txt
          echo "Commit: ${{ github.sha }}" >> artifact/${{ matrix.artifact_name }}/BUILD_INFO.txt

      - name: Upload EBOOT artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifact/
          if-no-files-found: warn
          
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/mecm' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: Download ME artifact
        uses: actions/download-artifact@v4
        with:
          name: snes9xTYLme_mod
          path: release/me/
          
      - name: Download CM artifact
        uses: actions/download-artifact@v4
        with:
          name: snes9xTYLcm_mod
          path: release/cm/

      - name: Create release archive
        run: |
          cd release
          zip -r ../snes9xTYL-mecm-release.zip .
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: snes9xTYL-mecm-release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
