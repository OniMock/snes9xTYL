name: Build snes9xTYL PSP

on:
  push:
    branches: [ mecm, main, master ]
    paths-ignore:
      - CHANGELOG.md
  pull_request:
    branches: [ mecm, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest

    strategy:
      fail-fast: false
      matrix:
        variant: [me, cm]
        include:
          - variant: me
            make_target: mehome
            artifact_name: snes9xTYLme_mod
            needs_me_prx: true
            needs_homehook_prx: true
          - variant: cm
            make_target: cm
            artifact_name: snes9xTYLcm_mod
            needs_me_prx: false
            needs_homehook_prx: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apk add --no-cache build-base zlib-dev python3

      - name: Validate Language Keys
        run: |
          python3 .github/scripts/check_lang_keys.py

      # ---------------------------------------------------------------
      # Build kernel PRX modules BEFORE the main EBOOT
      # These are separate kernel-mode plugins loaded at runtime
      # ---------------------------------------------------------------
      - name: Build mediaengine.prx
        if: matrix.needs_me_prx
        run: |
          export PSPSDK=$(psp-config --pspsdk-path)
          export PSPDEV=$(psp-config --pspdev-path)
          export PATH=$PATH:$PSPDEV/bin
          echo "=== Building mediaengine.prx ==="
          cd psp/mediaengineprx
          make clean || true
          make
          echo "=== Build result ==="
          ls -la *.prx *.elf 2>/dev/null || echo "No output files found"

      - name: Build homehook.prx
        if: matrix.needs_homehook_prx
        run: |
          export PSPSDK=$(psp-config --pspsdk-path)
          export PSPDEV=$(psp-config --pspdev-path)
          export PATH=$PATH:$PSPDEV/bin
          echo "=== Building homehook.prx ==="
          cd psp/homehookprx
          make clean || true
          make
          echo "=== Build result ==="
          ls -la *.prx *.elf 2>/dev/null || echo "No output files found"
          # The homehook Makefile rule copies prx to ../../ and .S to ../
          # Verify it ended up in the right place
          echo "=== Checking root for homehook.prx ==="
          ls -la ../../homehook.prx 2>/dev/null || echo "Not in root"

      # ---------------------------------------------------------------
      # Build main EBOOT
      # ---------------------------------------------------------------
      - name: Build ${{ matrix.artifact_name }}
        run: |
          export PSPSDK=$(psp-config --pspsdk-path)
          export PSPDEV=$(psp-config --pspdev-path)
          export PATH=$PATH:$PSPDEV/bin
          make clean || true
          make ${{ matrix.make_target }}

      - name: Find and list all build outputs
        if: always()
        run: |
          echo "=== All PRX files ==="
          find . -name "*.prx" -type f -exec ls -la {} \;
          echo "=== All PBP files ==="
          find . -name "*.PBP" -type f -exec ls -la {} \;
          echo "=== All ELF files ==="
          find . -name "*.elf" -type f -exec ls -la {} \;
          echo "=== All SFO files ==="
          find . -name "*.SFO" -type f -exec ls -la {} \;
          echo "=== Root directory ==="
          ls -la

      # ---------------------------------------------------------------
      # Assemble the release artifact with ALL required files
      # ---------------------------------------------------------------
      - name: Prepare artifact
        if: always()
        run: |
          DEST="artifact/${{ matrix.artifact_name }}"
          mkdir -p "$DEST/DATA"

          # === EBOOT.PBP ===
          EBOOT_PATH=$(find . -name "EBOOT.PBP" -type f | head -1)
          if [ -n "$EBOOT_PATH" ]; then
            echo "✓ Found EBOOT.PBP at: $EBOOT_PATH"
            cp "$EBOOT_PATH" "$DEST/EBOOT.PBP"
          else
            echo "✗ EBOOT.PBP not found! Attempting manual pack..."
            PRX_PATH=$(find . -name "snes9xTYL.prx" -type f | head -1)
            ELF_PATH=$(find . -name "snes9xTYL.elf" -type f | head -1)
            SFO_PATH=$(find . -name "PARAM.SFO" -type f | head -1)
            if [ -z "$SFO_PATH" ]; then
              mksfoex -d MEMSIZE=1 '${{ matrix.artifact_name }}' PARAM.SFO
              SFO_PATH="PARAM.SFO"
            fi
            DATA_FILE="${PRX_PATH:-$ELF_PATH}"
            if [ -n "$DATA_FILE" ]; then
              pack-pbp "$DEST/EBOOT.PBP" \
                "$SFO_PATH" data/icon0.png NULL NULL NULL NULL "$DATA_FILE" NULL
            fi
          fi

          # === mediaengine.prx (ME variant only) ===
          if [ "${{ matrix.needs_me_prx }}" = "true" ]; then
            ME_PRX=$(find . -name "mediaengine.prx" -type f | head -1)
            if [ -n "$ME_PRX" ]; then
              echo "✓ Found mediaengine.prx at: $ME_PRX"
              cp "$ME_PRX" "$DEST/mediaengine.prx"
            else
              echo "✗ ERROR: mediaengine.prx not found! The emulator WILL crash without it!"
              exit 1
            fi
          fi

          # === homehook.prx ===
          if [ "${{ matrix.needs_homehook_prx }}" = "true" ]; then
            HH_PRX=$(find . -name "homehook.prx" -type f | head -1)
            if [ -n "$HH_PRX" ]; then
              echo "✓ Found homehook.prx at: $HH_PRX"
              cp "$HH_PRX" "$DEST/homehook.prx"
            else
              echo "✗ ERROR: homehook.prx not found! The emulator WILL crash without it!"
              exit 1
            fi
          fi

          # === DATA/snesadvance.dat (speed hacks database) ===
          if [ -f "data/snesadvance.dat" ]; then
            echo "✓ Copying snesadvance.dat"
            cp data/snesadvance.dat "$DEST/DATA/snesadvance.dat"
          else
            echo "⚠ WARNING: data/snesadvance.dat not found (speed hacks won't work)"
          fi

          # === Final artifact contents ===
          echo ""
          echo "========================================="
          echo "  Release artifact: ${{ matrix.artifact_name }}"
          echo "========================================="
          find "$DEST" -type f -exec ls -lh {} \;

      - name: Upload release artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifact/${{ matrix.artifact_name }}/
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------
      # 🔢 Get version from makefile_multi
      # ----------------------------------------
      - name: Get project version
        id: get_version
        run: |
          VERSION=$(grep -E '^PROJECT_VERSION' makefile_multi | cut -d '=' -f2 | xargs)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Tag to be used: v$VERSION"

      # ----------------------------------------
      # 🏷️ Check if tag exists
      # ----------------------------------------
      - name: Check if tag exists
        id: check_tag
        run: |
          git fetch --tags
          if git tag -l "${{ steps.get_version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag already exists. Skipping release."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # ----------------------------------------
      # 📦 Install zip
      # ----------------------------------------
      - name: Install zip
        if: steps.check_tag.outputs.exists == 'false'
        run: sudo apt-get update && sudo apt-get install -y zip

      # ----------------------------------------
      # 📥 Download artifacts
      # ----------------------------------------
      - name: Download all artifacts
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          path: release_assets/

      # ----------------------------------------
      # 📦 Package artifacts
      # ----------------------------------------
      - name: Package artifacts into ZIPs
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          cd release_assets
          for dir in */; do
            zipname="${dir%/}.zip"
            echo "Packaging $dir into $zipname"
            (cd "$dir" && zip -r "../../$zipname" .)
          done
          cd ..
          ls -la *.zip

      # ----------------------------------------
      # 📝 Generate changelog (Release)
      # ----------------------------------------
      - name: Generate Changelog Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .github/scripts/cliff.toml
          args: --latest --strip header --tag ${{ steps.get_version.outputs.tag }} --output CHANGELOG.tmp.md

      - name: Update CHANGELOG.md (prepend)
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          if [ -f CHANGELOG.md ]; then
            cat CHANGELOG.tmp.md CHANGELOG.md > CHANGELOG.new.md
            mv CHANGELOG.new.md CHANGELOG.md
          else
            mv CHANGELOG.tmp.md CHANGELOG.md
          fi

          rm -f CHANGELOG.tmp.md

      - name: Commit changelog
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "onimock-actions"
          git config user.email "onimock-actions@github.com"

          git add CHANGELOG.md

          git commit -m "chore(release): update changelog ${{ steps.get_version.outputs.tag }} [skip cliff]" || echo "No changes"

          git push

      # ----------------------------------------
      # 🏷️ Create tag)
      # ----------------------------------------
      - name: Create tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "onimock-actions"
          git config user.email "onimock-actions@github.com"
          git tag ${{ steps.get_version.outputs.tag }}
          git push origin ${{ steps.get_version.outputs.tag }}

      # ----------------------------------------
      # 🚀 Create Release
      # ----------------------------------------
      - name: Create Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Snes9xTYL ${{ steps.get_version.outputs.tag }}
          body: |
            Snes9xTYL ${{ steps.get_version.outputs.version }}

            Improvements and fixes for stability and performance.

            ${{ steps.git-cliff.outputs.content }}
          files: |
            *.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
